---
name: Build and push containers

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  builder:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This is needed for PBR get the right version
          fetch-depth: 0
          persist-credentials: false
      # 'act' exports ACT=true in the container. Detect it so that local runs
      # build the image without logging in or pushing to the registry.
      - name: Detect local run
        id: local
        run: |
          if [ -n "${ACT:-}" ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: harbor.d4science.org/jupyterlab/hub
          tags: |
            type=sha
            type=pep440,pattern={{version}}
            latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: harbor.d4science.org
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name != 'pull_request' && steps.local.outputs.act != 'true'
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: ${{ github.event_name != 'pull_request' && steps.local.outputs.act != 'true' }}
          load: ${{ steps.local.outputs.act == 'true' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          context: .
